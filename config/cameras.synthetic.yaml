# SYNTHETIC-CLIP config variant (AI-generated scenario video).
#
# Does not replace cameras.yaml or cameras.dev.yaml. Points at the AI clip and
# carries zone polygons fitted to THAT framing (group-walkway "Concourse" on the
# left, taped-off "Restricted Area" wedge on the right).
#
# Polygons below are in REAL pixel coords of the actual clip (464x688), read off
# evidence/scenario_first_frame.jpg. Fine-tune with tools/zone-editor.html if a
# rule mis-fires. area_sqm on the concourse is intentionally small so the group
# trips density for the demo — set the real measured area for production.

camera_id: CAM-SYN-01
site_id: SITE-SYN-01

source: media/scenario_demo.mp4
frame_width: 464
frame_height: 688

# Detection — CPU, .pt. imgsz upsamples the small 464-wide frame for recall.
model_path: models/yolov8n.pt
device: cuda        # NVIDIA RTX PRO 2000 (Blackwell); falls back to CPU if absent
conf_threshold: 0.35
person_class_id: 0
process_fps: 20     # GPU sustains ~24 FPS @ imgsz 1280; caps near source rate.
imgsz: 1280         # (CPU fallback self-limits to whatever it manages.)

# No seed zones — zones are defined MANUALLY per clip in tools/zone-editor.html.
# Editor zones are saved per-camera and hot-reload into the running camera live.
# (Leaving this empty means the stream shows NO zone overlay until you draw one.)
zones: []
