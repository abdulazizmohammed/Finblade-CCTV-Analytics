# Template config for cameras PROVISIONED FROM THE UI (Add camera form).
# camera_id / site_id / source are overridden per camera via run_cpu CLI flags;
# these are just placeholders. Frame size is auto-detected from the source.
# Zones are defined per-camera in the zone editor (none seeded here).

camera_id: UI-CAM
site_id: SITE-UI

source: ""              # overridden with --source (the RTSP URL / file)
frame_width: 1280
frame_height: 720

model_path: models/yolov8n.pt
device: cuda            # NVIDIA GPU; falls back to CPU if unavailable
# Detection sensitivity. This has been moved twice on real footage:
#   0.35 -> empty chairs and sofas detected as people
#   0.50 -> chairs gone, but real people at 640x360 were being MISSED
#   0.40 -> current
#
# The lesson from that: a confidence threshold is a blunt instrument for false
# positives. A reflection in a TV, a figure on a poster and a chair-shaped sofa
# are all genuinely person-shaped, so there is no value that removes them
# without also removing real people who are small, distant, or partly occluded.
#
# Use an UNMONITORED mask zone for those instead — it targets exactly the region
# that is not real floor and costs nothing in sensitivity. Keep this threshold
# low enough to SEE people, and mask the places that lie.
#
# Raise toward 0.5 only if you have no masks drawn and prefer missing people to
# counting furniture.
conf_threshold: 0.4
person_class_id: 0
process_fps: 15
imgsz: 1280

# Cross-camera identity for UI-provisioned cameras. This was working implicitly
# (an absent block defaults to enabled), but stating it makes it tunable and
# makes it obvious that cameras added from the UI take part in identity
# matching. Pair them up in config/topology.yaml — until a pair is listed there
# it falls back to the permissive default transit window.
reid:
  enabled: true
  weights: models/osnet_x0_25_msmt17.pt
  device: "0"
  interval_seconds: 1.0
  # More views per person than the default 5. Individual embeddings from a
  # low-resolution substream are noisy, so the bank needs more of them before
  # its average is trustworthy.
  max_samples: 8
  budget_per_frame: 8
  min_samples_to_resolve: 2

  # SET THIS TO MATCH YOUR SOURCE RESOLUTION.
  #
  # A person's bounding box must be at least this tall in PIXELS to be embedded.
  # OSNet resizes every crop to 256x128, so the number is really "how much real
  # detail is there to resize":
  #     96px -> 2.7x upscale, good
  #     64px -> 4x upscale, degraded but usable
  #     48px -> 5.3x upscale, mostly noise - poisons the gallery
  #
  # As a share of frame height that means very different things:
  #     1080p main stream : 96px  =  9% of frame   <- use 96
  #     640x360 substream : 96px  = 27% of frame   <- far too strict, use 64
  #
  # At 96 on a 360p substream only people right in front of the camera are ever
  # embedded, and cross-camera identity silently stops working for everyone
  # else. Below ~48 the embeddings are too weak to match reliably and the same
  # person splits into several identities instead — so this is a floor to lower
  # carefully, not to remove.
  min_crop_height: 64
  min_crop_confidence: 0.5

zones: []
