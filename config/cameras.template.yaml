# Template config for cameras PROVISIONED FROM THE UI (Add camera form).
# camera_id / site_id / source are overridden per camera via run_cpu CLI flags;
# these are just placeholders. Frame size is auto-detected from the source.
# Zones are defined per-camera in the zone editor (none seeded here).

camera_id: UI-CAM
site_id: SITE-UI

source: ""              # overridden with --source (the RTSP URL / file)
frame_width: 2688
frame_height: 1520

model_path: models/yolo11s.pt
device: cuda            # NVIDIA GPU; falls back to CPU if unavailable
# Detection sensitivity. This has been moved twice on real footage:
#   0.35 -> empty chairs and sofas detected as people
#   0.50 -> chairs gone, but real people at 640x360 were being MISSED
#   0.40 -> current
#
# The lesson from that: a confidence threshold is a blunt instrument for false
# positives. A reflection in a TV, a figure on a poster and a chair-shaped sofa
# are all genuinely person-shaped, so there is no value that removes them
# without also removing real people who are small, distant, or partly occluded.
#
# Use an UNMONITORED mask zone for those instead — it targets exactly the region
# that is not real floor and costs nothing in sensitivity. Keep this threshold
# low enough to SEE people, and mask the places that lie.
#
# Raise toward 0.5 only if you have no masks drawn and prefer missing people to
# counting furniture.
#
# MEASURED 2026-07-29 on a Hikvision 4MP, same scene, both streams
# (scripts/probe_confidence.py, 120s each, ~3600 frames):
#
#                        chair (static)        real people (moving)
#   sub  640x360  (/102) median 0.16-0.23      median 0.309, only 37% >= 0.4
#   main 2688x1520(/101) median 0.232, MAX     median 0.77-0.91, 75-100% >= 0.4
#                        0.263, NEVER >= 0.4
#
# So the threshold was never the problem — the SUBSTREAM was. At 640x360 people
# and furniture land in the same narrow band and no cut separates them; at full
# resolution they are half a point apart and 0.4 excludes the chair by itself.
# Before touching this number, check what stream the camera is actually on:
# /Streaming/Channels/102 is the Hikvision substream, 101 is main.
conf_threshold: 0.4
person_class_id: 0
process_fps: 15
imgsz: 1280

# Cross-camera identity for UI-provisioned cameras. This was working implicitly
# (an absent block defaults to enabled), but stating it makes it tunable and
# makes it obvious that cameras added from the UI take part in identity
# matching. Pair them up in config/topology.yaml — until a pair is listed there
# it falls back to the permissive default transit window.
reid:
  enabled: true
  weights: models/osnet_x0_25_msmt17.pt
  device: "0"
  interval_seconds: 0.4
  # More views per person than the default 5. Individual embeddings from a
  # low-resolution substream are noisy, so the bank needs more of them before
  # its average is trustworthy.
  max_samples: 8
  budget_per_frame: 8
  min_samples_to_resolve: 3

  # SET THIS TO MATCH YOUR SOURCE RESOLUTION.
  #
  # A person's bounding box must be at least this tall in PIXELS to be embedded.
  # OSNet resizes every crop to 256x128, so the number is really "how much real
  # detail is there to resize":
  #     96px -> 2.7x upscale, good
  #     64px -> 4x upscale, degraded but usable
  #     48px -> 5.3x upscale, mostly noise - poisons the gallery
  #
  # As a share of frame height that means very different things:
  #     1080p main stream : 96px  =  9% of frame   <- use 96
  #     640x360 substream : 96px  = 27% of frame   <- far too strict, use 64
  #
  # At 96 on a 360p substream only people right in front of the camera are ever
  # embedded, and cross-camera identity silently stops working for everyone
  # else. Below ~48 the embeddings are too weak to match reliably and the same
  # person splits into several identities instead — so this is a floor to lower
  # carefully, not to remove.
  min_crop_height: 64
  min_crop_confidence: 0.5

# Fire / smoke detection (R-10). A SECOND MODEL on the same decoded frame.
#
# OFF by default, and that is a GPU-budget decision rather than caution about
# the feature. Phase 1 measured a second always-on detector at ~21ms/frame:
# VRAM is a non-issue (~37 MiB marginal, because the CUDA context is shared
# within the worker process) but GPU COMPUTE roughly doubles, and one camera at
# 1080p drops from ~24fps to ~10fps if it runs per frame.
#
# interval_seconds is what makes it affordable: at 2 Hz the second model costs
# roughly 13% of its per-frame price. A fire that matters persists for seconds;
# sub-second flicker is the false-positive generator, not the signal.
#
# conf_threshold is DELIBERATELY BELOW the rule's arming thresholds
# (fire_on 0.60, smoke_on 0.65 in finblade/rules.py). This floor decides what
# is reported; the rule decides what alerts. Raise it to the rule's bar and the
# rule's hysteresis has nothing to clear against.
#
# THE CHECKPOINT IS AN EVALUATION MODEL, NOT A VALIDATED FIRE ALARM.
# rabahdev/fire-smoke-yolov8n, trained on D-Fire (CC0-1.0), classes
# {0: smoke, 1: fire}. It carries an AGPL-3.0 dependency via Ultralytics
# YOLOv8 — commercial deployment needs the approved Ultralytics licensing
# arrangement. See DECISIONS.md D-31.
hazard:
  # Enabled 2026-09-03 for demonstration on the PPE/fire training clip.
  #
  # NOTE THIS IS THE SHARED TEMPLATE: every UI-provisioned camera reads it, so
  # turning this on turns a second model on for ALL of them, not just the one
  # you had in mind. Measured cost is small (16.6 ms warm, 32 MiB, ~33 ms of
  # GPU per second per camera at 2 Hz) but it is per camera, and this box has
  # a history of PCIe faults under sustained multi-model GPU load. Set it back
  # to false before running a large camera bank.
  enabled: true
  weights: models/fire_smoke_yolov8n.pt
  device: "0"
  interval_seconds: 0.5      # 2 Hz
  conf_threshold: 0.30
  imgsz: 640                 # the size this checkpoint was trained at

zones: []
