# CAM-VID-1 — reads the RTSP stream published from media/cam-vid-1.mp4.
#
#   bash scripts/rtsp_dual.sh          # publishes cam1 + cam2
#   run_cpu.py --config config/cameras.vid1.yaml --port 8091 \
#              --api-url http://127.0.0.1:8000
#
# Pairs with config/cameras.vid2.yaml via config/topology.vid.yaml.

camera_id: CAM-VID-1
site_id: SITE-DXB-01

source: rtsp://127.0.0.1:8554/cam1
frame_width: 752
frame_height: 416

model_path: models/yolov8n.pt
device: cuda
conf_threshold: 0.35
person_class_id: 0
# Source is 24 fps; 12 keeps latency low and leaves headroom on the GPU.
process_fps: 12
# The clip is small (752x416). imgsz below the frame size would throw away the
# detail the detector needs on already-small people, so upscale to 960.
imgsz: 960

reid:
  enabled: true
  weights: models/osnet_x0_25_msmt17.pt
  device: "0"
  interval_seconds: 0.7
  max_samples: 6
  budget_per_frame: 8
  min_samples_to_resolve: 2

# PLACEHOLDER polygon covering most of the floor — I cannot see where the real
# floor is in this clip. Draw the real one with tools/zone-editor.html against
# media/CAM-VID-1_frame.jpg (saved on the first run).
zones:
  - zone_id: ZONE-VID1-FLOOR
    zone_name: Camera 1 Floor
    restricted: false
    capacity_max: 20
    area_sqm: 50.0
    polygon: [[40, 120], [712, 120], [712, 400], [40, 400]]
