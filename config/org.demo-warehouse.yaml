# Demo warehouse branch for the six-camera warehouse bank (CAM-NVW-00..05).
#
# Kept OUT of config/org.wareed.yaml on purpose: that file is the client's
# network, and this branch exists to host demonstration footage. It hangs off
# the existing CENTRAL / RUH nodes (names repeated verbatim — the import is an
# upsert, so a differing name here would rename the real city).
#
#   .venv/bin/python scripts/seed_org.py --config config/org.demo-warehouse.yaml
#
# To remove it: stop the NVW cameras, DELETE /api/v1/cameras/CAM-NVW-0{0..5},
# then DELETE /api/v1/org/branches/RUH-WH1 (refused while cameras remain).
#
# lat/lon is a placeholder pin in Riyadh, like every pin in org.wareed.yaml.

regions:
  - region_id: CENTRAL
    name: Central Region
    cities:
      - city_id: RUH
        name: Riyadh
        branches:
          - {branch_id: RUH-WH1, name: Riyadh Warehouse (demo footage), branch_type: WAREHOUSE, timezone: Asia/Riyadh, lat: 24.6936, lon: 46.7203}
