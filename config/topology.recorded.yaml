# Camera topology for the RECORDED-STREAM RIG, not the live building.
#
# config/topology.yaml describes the real site and its paced walk times, and the
# test server runs on it. This file is a separate variant so that tuning against
# the recordings cannot damage a survey somebody walked the building to produce.
# Select it with FINBLADE_TOPOLOGY=config/topology.recorded.yaml.
#
# THE RIG, as described by the operator:
#
#   CAM-01  reception_elevator   Door + Entrance Lobby, corner view of the lift
#   CAM-02  reception            Reception
#   CAM-03  gf_lobby_elevator    GF Elevator + GF Steps
#   CAM-04  1f_lobby             1F Passage      -- first floor, overlaps nothing
#   CAM-05  2f_lobby             2F Passage      -- second floor, overlaps nothing
#
# A person walks them in order, CAM-01 through CAM-05.
#
# THE GROUND FLOOR IS ONE PLACE SEEN THREE WAYS. CAM-01, CAM-02 and CAM-03 all
# overlap: CAM-01 catches the lift from the corner, CAM-03 watches that same
# lift head on, and reception sits between them. All three pairs are declared,
# because overlap is a set of PAIRS to this code and is not transitive - a pair
# left undeclared is treated as a walk between separate rooms.
#
# That declaration does real work twice over. Simultaneous presence becomes
# evidence FOR a match rather than a conflict, so the three ground-floor views
# reinforce one identity instead of competing to own it; and physical-area
# occupancy stops counting one person once per camera.
#
# THE FLOORS ABOVE ARE REAL WALKS, and their minimums are load-bearing. The
# first version of this file set every minimum to zero, to stop the live
# topology's windows rejecting everything, and said they should be tightened
# once matching worked. This is that tightening. A zero minimum says a person
# can be on the first floor and at reception in the same instant, which is
# exactly the wrong thing to permit: it let a CAM-04 track match a reception
# identity at 0.750 in preference to the adjacent CAM-03 at 0.668, because
# appearance was confident and physics had been told to stay out of it.
#
# Minimums sit below the observed transits, not at them - what was measured is
# the fastest anyone was seen to do it, not the fastest it can be done.
#
#     hop              observed    min     max
#     CAM-03 -> 04      22-24s        12s     50s
#     CAM-04 -> 05      20-22s        10s     50s
#     ground -> 05      ~42s          25s    100s
#
# THE MAXIMUMS MATTER AS MUCH AS THE MINIMUMS, which took a concrete failure to
# see. They were 150s and 240s - guesses made to stop the gate rejecting
# everything while the rest was tuned. A maximum far above the real transit does
# not simply admit the truth; it admits everyone ELSE as well, and then
# appearance has to separate people that physics should never have offered.
#
# The CAM-04 arrival that broke the chain had two candidates:
#
#     from CAM-03  dt 27.8s  score 0.623   <- the walker
#     from CAM-01  dt 55.5s  score 0.565   <- somebody else on the ground floor
#     margin 0.058, requires 0.060 -> both refused, new identity minted
#
# At a 50s maximum the 55.5s candidate is too_slow and never reaches scoring.
# The walker is then the ONLY survivor, the margin rule is waived because there
# is nothing to be ambiguous against, and the link is made on the score alone.
#
# Note what this is NOT: it is not a lower threshold, a smaller margin, or a
# bonus for the "right" camera. CAM-01 and CAM-03 overlap - they are one place
# seen twice - so no adjacency rule can tell them apart, and both are equally
# adjacent to CAM-04. What separates them is TIME: 27.8s matches a 22-24s walk,
# 55.5s does not. The gate already knows how to use that; it just needed to be
# told the truth about the walk.

overlapping_pairs:
  - {a: CAM-01, b: CAM-02}
  - {a: CAM-01, b: CAM-03}
  - {a: CAM-02, b: CAM-03}

transits:
  # Ground floor to the first: the only way up that these cameras see.
  - {a: CAM-01, b: CAM-04, min_seconds: 12, max_seconds: 50}
  - {a: CAM-02, b: CAM-04, min_seconds: 12, max_seconds: 50}
  - {a: CAM-03, b: CAM-04, min_seconds: 12, max_seconds: 50}

  # First floor to the second.
  - {a: CAM-04, b: CAM-05, min_seconds: 10, max_seconds: 50}

  # Ground floor to the second has to pass the first, so it cannot be quicker
  # than the two legs together - nor much slower than both of them.
  - {a: CAM-01, b: CAM-05, min_seconds: 25, max_seconds: 100}
  - {a: CAM-02, b: CAM-05, min_seconds: 25, max_seconds: 100}
  - {a: CAM-03, b: CAM-05, min_seconds: 25, max_seconds: 100}

# Every pair of the five is described above. Left permissive because the dev box
# also carries CAM-06 and the CAM-ST1-* fixtures, and refusing them outright
# would break those runs rather than this one. v_journey_links reports anything
# that lands here as pair_kind='default'.
default_transit:
  min_seconds: 0
  max_seconds: 180

overlap_tolerance_seconds: 5.0
allow_unknown_pairs: true

# A person gone from one camera for longer than this is a new visit, not the
# same track resuming. Below the ~145s loop length on purpose: without it a
# track matches its own record from the previous pass, which scores higher than
# the genuine neighbour and breaks the walk exactly there.
same_camera_max_seconds: 90.0

# Tuning for this rig. Environment variables still win for threshold/margin/ttl
# (FINBLADE_REID_*), so this block is where the values with no env knob live.
matching:
  # The worker collects up to max_samples (8) crops per track, but a gallery
  # identity only kept 5 of them. Cross-camera matching is a viewpoint problem
  # above all - the more angles an identity carries, the better its chance of
  # resembling the same person seen from somewhere new. Match the worker.
  bank_capacity: 8
