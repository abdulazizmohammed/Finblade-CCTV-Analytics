# Camera topology for cross-camera identity (finblade/topology.py).
#
# This file encodes site knowledge that no model can infer from the video:
# which cameras see the same floor, and how long it takes a person to walk
# between the ones that don't. It is the gate that stops appearance matching
# from linking two similar-looking strangers.
#
# ---------------------------------------------------------------------------
# TWO SITES SHARE THIS FILE and are at different stages.
#
#   CAM-01..CAM-06   test site. SURVEYED 2026-08-18 - every one of its 15 pairs
#                    is described, with paced times. Not placeholders.
#   CAM-ST1-*        dev box. Overlaps declared from the operator's own area
#                    mapping; its transits are still unsurveyed and fall through
#                    to default_transit.
#
# Wrong transit times fail in two directions, both bad:
#   min too LOW  -> strangers get linked (two people become one on the dashboard)
#   min too HIGH -> real handovers are missed (one person becomes two)
#
# Of the two, min-too-high is the one that hides: the match is refused on
# physics before appearance is ever scored, so the logs show a healthy system
# quietly counting one person as two. Pace the walk; do not estimate upward.
# ---------------------------------------------------------------------------

# Pairs whose views share floor area. The same person is legitimately visible
# on both AT THE SAME MOMENT, so dt near zero is expected — and simultaneous
# presence is evidence FOR a match. This is also what makes site occupancy
# stop double-counting someone standing in the overlap.
overlapping_pairs:
  # Confirmed by the operator 2026-07-30: CAM-03 covers the entrance, CAM-04
  # covers the reception seats AND sees part of the entrance. A person standing
  # in that overlap is visible to both AT THE SAME MOMENT.
  #
  # Before this was declared, that simultaneity was being read as "impossible" —
  # dt~0 fell under the 2.0s default minimum — so every correct match here was
  # rejected before appearance was even scored, and one person standing in the
  # entrance counted as two on the site total.
  - a: CAM-03
    b: CAM-04

  # Added 2026-08-17. Both of these pairs were already declared by the operator
  # as sharing a room — each camera's zone carries the same physical_area_id —
  # but neither appeared here, so the identity matcher was treating them as
  # unknown pairs on the default window below. Live at the time: unknown_pair
  # 899, rejected_topology 233, and two cameras on one office reporting 1 + 3
  # people for the three who were in it.
  #
  # The area mapping is the authority for an overlap, not observed timing.
  # scripts/propose_topology.py classified CAM-ST-05 <-> CAM-ST1-04 as a WALK
  # of median 21s from 292 samples, which is wrong and instructively so: those
  # samples were produced by ReID running under this file's previous contents,
  # where the pair was unknown. The 21s it measured is how long re-matching took
  # to recover, not how long anyone walked. The script warns about exactly this
  # circularity in its own header. Two zones pointing at one physical area is a
  # statement a human made about the building; prefer it.

  # Room2 — ZONE-ST1-04 and ZONE-ST1-05, both physical_area_id "Room2".
  # Two angles on one office. Confirmed against the live feeds.
  - a: CAM-ST1-04
    b: CAM-ST-05

  # Entrance-ST1 — ZONE-ST1-01 and ZONE-ST1-02, both physical_area_id
  # "Entrance-ST1". Declared from the same area mapping. NOT yet confirmed
  # against footage: both cameras were offline when this was written, so if the
  # entrance and the lobby turn out to be adjacent rather than shared, move this
  # to `transits` with a paced walk time.
  - a: CAM-ST1-01
    b: CAM-ST1-02

  # CAM-VID-1 <-> CAM-VID-2 (site SITE-DXB-01) is the one pair the observed data
  # can settle on its own: 264 handovers at a median gap of 0.31s, 65% inside the
  # overlap window. A third of a second is simultaneity, not a walk, and unlike
  # the Room2 pair that conclusion does not depend on the topology being right
  # beforehand. Left commented because both cameras are offline and neither has
  # zones drawn, so nothing has confirmed it visually — uncomment when that site
  # is next running.
  # - a: CAM-VID-1
  #   b: CAM-VID-2

  # STILL UNSURVEYED. Add any other pair that shares floor area, and put walk
  # times in `transits` for pairs separated by a route. Order does not matter;
  # pairs are stored normalised.
  #
  # Not overlapping, and deliberately absent: CAM-ST1-03 (Room1) is the only
  # camera on its area, so it has no partner to share floor with.
  #
  # CORRECTION 2026-08-17. An earlier revision of this comment claimed CAM-03
  # and CAM-04 had been deleted and that their pairing wanted rechecking. That
  # was read off the DEV box, where those ids are indeed gone, and it is wrong
  # about the deployment this entry was written for. On the test site both
  # cameras are live and are exactly what the note above says: CAM-03 is the
  # ENT-01 entrance, CAM-04 is Recp-01 reception. The pairing stands.
  #
  # The lesson is in the ids. CAM-01..CAM-06 on the test site and CAM-ST1-*
  # on the dev box are different buildings sharing one topology file, and a
  # bare number is not a name. Entries for absent cameras are simply never
  # consulted, so both sets can live here — but check which site an id belongs
  # to before concluding anything from its absence.

# Pairs separated by a walk. min_seconds is the fastest a person could
# physically cover it; max_seconds is the longest gap still worth treating as
# one continuous journey rather than a fresh visit.
transits:
  # =========================================================================
  # TEST SITE (CAM-01..CAM-06), surveyed by the operator 2026-08-18.
  #
  #   CAM-01  GF  lift lobby and stair foot, whole floor visible
  #   CAM-02  1F  lift lobby and stair foot
  #   CAM-03  GF  entrance/exit door and reception lobby
  #   CAM-04  GF  reception sitting        (overlaps CAM-03 on the entrance mat)
  #   CAM-05  2F  passage
  #   CAM-06  2F  lift lobby and stair head
  #
  # min_seconds IS THE FASTEST ROUTE, NOT THE USUAL ONE. Where stairs and a lift
  # both connect two floors the minimum is whichever is quicker, and it is
  # shaved a couple of seconds below the paced figure. Erring low costs a little
  # precision; erring high rejects a real handover as physically impossible, and
  # that failure is silent - the person simply becomes two people.
  #
  # WHY INDIRECT PAIRS ARE DECLARED TOO. Identity resolution on this site
  # currently runs 0.1-5.5% per camera, so a person walking GF -> 2F is usually
  # NOT re-identified at the intermediate camera. The match that has to succeed
  # is the end-to-end one, and if only adjacent pairs were declared every such
  # journey would fall through to the permissive default instead of being
  # gated. Their minima are the shortest path through the adjacency graph.
  #
  # max_seconds is roughly three times the peak wait, kept under ttl_seconds
  # (300) so the gallery never expires an identity before its window closes. If
  # real journeys start exceeding these, raise BOTH together.
  # =========================================================================

  # --- direct routes, paced -------------------------------------------------

  # GF <-> 1F. Stairs 12s brisk; lift typically 20s, up to 50s at peak.
  - a: CAM-01
    b: CAM-02
    min_seconds: 10
    max_seconds: 150

  # GF <-> 2F. Stairs 14s brisk; lift typically 40s, up to 90s at peak. The
  # longest single hop in the building, hence the widest window.
  - a: CAM-01
    b: CAM-06
    min_seconds: 12
    max_seconds: 240

  # 1F <-> 2F. Lift 10s BEATS the stairs at 15s here, so the lift sets the
  # minimum - the one pair in the building where it does.
  - a: CAM-02
    b: CAM-06
    min_seconds: 8
    max_seconds: 120

  # Same floor, 2F. Explicitly NOT overlapping: a 6s walk between two views.
  - a: CAM-05
    b: CAM-06
    min_seconds: 5
    max_seconds: 120

  # Across the ground-floor lobby, entrance to lift.
  - a: CAM-01
    b: CAM-03
    min_seconds: 10
    max_seconds: 120

  # --- indirect routes, minima derived from the shortest path ---------------

  # Lift lobby <-> reception sitting. Via CAM-03, which overlaps CAM-04, so the
  # second leg costs nothing: 10 + 0.
  - a: CAM-01
    b: CAM-04
    min_seconds: 10
    max_seconds: 120

  # GF lift <-> 2F passage, via CAM-06: 12 + 5.
  - a: CAM-01
    b: CAM-05
    min_seconds: 17
    max_seconds: 240

  # 1F <-> entrance, via CAM-01: 10 + 10.
  - a: CAM-02
    b: CAM-03
    min_seconds: 20
    max_seconds: 180

  # 1F <-> reception sitting. Same path as above; CAM-03/CAM-04 overlap.
  - a: CAM-02
    b: CAM-04
    min_seconds: 20
    max_seconds: 180

  # 1F <-> 2F passage, via CAM-06: 8 + 5.
  - a: CAM-02
    b: CAM-05
    min_seconds: 13
    max_seconds: 180

  # Entrance <-> 2F passage. The operator states there is NO route that avoids
  # CAM-06 and CAM-01, so the minimum is the full chain: 10 + 12 + 5.
  - a: CAM-03
    b: CAM-05
    min_seconds: 27
    max_seconds: 270

  # Entrance <-> 2F lift, via CAM-01: 10 + 12.
  - a: CAM-03
    b: CAM-06
    min_seconds: 22
    max_seconds: 240

  # Reception sitting <-> 2F passage. As CAM-03 <-> CAM-05; the overlap is free.
  - a: CAM-04
    b: CAM-05
    min_seconds: 27
    max_seconds: 270

  # Reception sitting <-> 2F lift.
  - a: CAM-04
    b: CAM-06
    min_seconds: 22
    max_seconds: 240

  # All 15 pairs of CAM-01..CAM-06 are now described: 14 transits above plus the
  # CAM-03/CAM-04 overlap. allow_unknown_pairs stays TRUE all the same, because
  # this file also serves the dev box (CAM-ST1-*), whose pairs are only partly
  # surveyed. Setting it false would reject every undeclared pair there.

  # NEEDS A HUMAN — the routes between the three ST1 areas. A person can walk
  # Entrance-ST1 -> Room1 -> Room2, so these pairs are real transits and their
  # minimum is genuinely non-zero, but nothing here knows how far apart they
  # are. propose_topology.py saw 1 to 3 samples each, which is not enough to
  # take a number from. Pace each walk and fill them in:
  #
  #   CAM-ST1-01 / CAM-ST1-02  (Entrance-ST1)  <->  CAM-ST1-03  (Room1)
  #   CAM-ST1-01 / CAM-ST1-02  (Entrance-ST1)  <->  CAM-ST1-04 / CAM-ST-05  (Room2)
  #   CAM-ST1-03               (Room1)         <->  CAM-ST1-04 / CAM-ST-05  (Room2)
  #
  # Until then they fall through to default_transit below, which is permissive
  # (0-120s) and will accept a handover that was really too fast to be one.
  # That is the deliberate trade: an unsurveyed site keeps matching rather than
  # silently refusing every candidate.

# Applied to any pair not listed above. Deliberately permissive so an
# incomplete topology degrades to "matching still works, just less precisely"
# rather than silently refusing every handover. Unknown pairs are reported as
# reason="unknown_pair" so you can see which pairs still need surveying.
default_transit:
  # min_seconds is 0.0, matching the reasoned default in finblade/topology.py.
  # It used to be 2.0 here, which silently overrode that: a non-zero minimum is
  # an ASSUMPTION that two cameras are far apart, and for an unsurveyed pair we
  # do not know that. Where it was wrong — any pair that actually overlaps — it
  # rejected every correct match as "physically impossible" and cross-camera
  # matching quietly did nothing while the logs looked healthy. Measured on this
  # site: 786 rejected_topology against 75 matched.
  #
  # Raise this only for a pair you have surveyed, and raise it in `transits`
  # for that specific pair rather than here.
  min_seconds: 0.0
  max_seconds: 120.0

# Independent camera processes keep their own clocks. An overlapping pair can
# legitimately report a slightly negative dt; this is how much skew to forgive.
overlap_tolerance_seconds: 5.0

# Set false on a fully surveyed site to reject any pair not listed above.
# Strictest and safest setting once the topology is complete.
allow_unknown_pairs: true

# ---------------------------------------------------------------------------
# Cross-camera MATCHING parameters.
#
# Override at runtime without a restart (the gallery is preserved):
#     curl -X POST localhost:8000/api/v1/identity/tuning \
#          -H 'Content-Type: application/json' \
#          -d '{"threshold": 0.65}'
# then write whatever you settle on back into this block. Environment variables
# FINBLADE_REID_THRESHOLD / _MARGIN / _TTL override this file.
# ---------------------------------------------------------------------------
matching:
  # Minimum cosine similarity to accept a match. This is a FLOOR, not a
  # decision boundary. Measured on a synthetic second camera
  # (evidence/cross_camera_eval_dense.json): true pairs min 0.80 / median 0.90,
  # false pairs median 0.61 but MAX 0.83 — the distributions OVERLAP, so no
  # value here separates them cleanly. What actually prevents bad merges is the
  # margin below plus the transit gate above.
  #
  # That measurement came from an easy synthetic pair. Real cameras — and
  # especially 640x360 substreams — push true-pair scores DOWN, so 0.70 may be
  # too strict for your site. Lower it if genuine handovers are being missed.
  threshold: 0.70

  # The best candidate must beat the runner-up by this much. In a uniformed
  # environment several people score alike, and the honest answer there is
  # "I don't know" rather than "the top one by 0.01". Raising it splits more;
  # 0.0 disables the check and restores pick-the-best.
  margin: 0.06

  # How long an identity stays matchable after it was last seen. Longer means
  # someone can leave and return and still be recognised, at the cost of a
  # larger gallery and more chances for a wrong match.
  ttl_seconds: 300

  # Views kept per person. More is steadier on noisy low-resolution sources.
  bank_capacity: 5

  # Gallery cap. Oldest inactive identities are evicted beyond this.
  max_identities: 2000
