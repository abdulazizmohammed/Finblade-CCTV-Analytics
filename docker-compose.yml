services:
  # Stage 2 — video ingest. Republishes ./media/clip.mp4 as a looping RTSP source.
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ./media:/media:ro

  # Stage 3 — vision inference (the spine). Detect + track + zone + occupancy.
  inference:
    build: ./services/inference
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "8080:8080"     # annotated MJPEG viewer -> open http://<host>:8080
    volumes:
      - ./config:/config:ro
      - ./media:/media           # writable: service saves a reference still here
      - ./models:/models:ro      # put the exported OpenVINO model dir here
    devices:
      - "/dev/dri:/dev/dri"      # Arc GPU passthrough for OpenVINO device=GPU
    group_add:
      - "video"
      - "render"

  # Stage 4 — event bus. Two streams: fb:events (every ingested event) and
  # fb:facility (merged occupancy counts). See services/api/bus.py.
  #
  # Published on the host port because THE API DOES NOT RUN IN COMPOSE — it runs
  # under systemd or scripts/start_stack.sh and reads .env (see docs/DEPLOY.md).
  # So this container exists to give that process a Redis to connect to, and
  # .env needs the matching line:
  #
  #     REDIS_URL=redis://127.0.0.1:6379/0
  #
  # Without REDIS_URL the API falls back to InMemoryBus and publishes into RAM.
  # That is a working system with no bus, not a broken one — but nothing outside
  # the process ever sees a count, so check /api/v1/health -> facility_counts.bus
  # if a consumer is seeing nothing.
  #
  # A host Redis (apt install redis-server) serves the same purpose; use one or
  # the other, not both on 6379.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No persistence on purpose. Both streams are live telemetry with a capped
    # backlog (MAXLEN 10000) and the durable record is Postgres; an RDB dump
    # would preserve a stale backlog across a restart to no benefit.

  # ---- NEXT STEPS (build these once the spine is green) ----
