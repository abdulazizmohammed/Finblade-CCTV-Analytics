  industrial_ppe:
    purpose: industrial PPE compliance (R-11, industrial profile)
    file: models/ppe_safetyvision_v2.pt
    sha256: 7863be4700dcf831579d610bb3fe3668fb29fb22ab17ca027b55e94b88bfff7a
    bytes: 22547434
    source: ayushgupta7777/safetyvision-yolov8, v2/best.pt
    framework: ultralytics==8.3.40
    classes: [Fall-Detected, Gloves, Goggles, Hardhat, Mask, NO-Gloves,
              NO-Goggles, NO-Hardhat, NO-Mask, NO-Safety Vest, No_Harness,
              Person, Safety Vest]
    consumed_classes: [Hardhat, NO-Hardhat, Safety Vest, NO-Safety Vest,
                       Mask, NO-Mask, Person]
    ignored_classes: [Fall-Detected, Gloves, Goggles, NO-Gloves, NO-Goggles,
                      No_Harness]
    status: evaluation
    production_validated: false
    site_validated: false
    license: AGPL-3.0 (based on Ultralytics YOLOv8)
    license_verified: false
    measured_on_our_footage:
      clip: media/PPEVideo.mp4
      frames_sampled: 200
      conf_threshold: 0.35
      boxes_per_frame:
        Safety Vest: 1.48          # median confidence 0.71
        NO-Hardhat: 1.28           # 0.63
        NO-Safety Vest: 1.27       # 0.42 — barely above min_confidence 0.40
        Hardhat: 0.65              # 0.56
        NO-Gloves: 0.01            # 0.36, one box in 200 frames
      never_fired: [Gloves, Goggles, NO-Goggles, No_Harness, Fall-Detected,
                    Mask, NO-Mask, Person]
    notes: >-
      Mask and NO-Mask produce NOTHING on our footage, so mask compliance is
      untested rather than demonstrated. No_Harness has no positive Harness
      counterpart, so a harness could only ever be judged on absence — unusable
      with the evidence model, not merely unmapped. See DECISIONS.md D-32.

  # --- EVALUATED AND REJECTED ------------------------------------------------
  # Kept here, not deleted, so the measurement survives. Without it somebody
  # rediscovers this checkpoint in three months, sees "paired positive and
  # negative classes" on the model card, and spends a day on it again.
  rejected_keremberke_ppe_v8s:
    purpose: candidate medical/general PPE detector — REJECTED
    file: models/eval_keremberke_ppe_v8s.pt
    source: keremberke/yolov8s-protective-equipment-detection (best.pt)
    evaluated: 2026-09-14
    framework: YOLOv8s, trained on ultralytics 8.0.21; loads fine on 8.3.40
    classes_verified_from_weights:
      [glove, goggles, helmet, mask, no_glove, no_goggles, no_helmet, no_mask,
       no_shoes, shoes]
    published_map50: 0.278
    license: not stated by the repo
    license_verified: false
    status: rejected
    why_it_looked_promising: >-
      Paired positive AND negative classes for mask, gloves, goggles, helmet and
      shoes — the structure our evidence model needs, and exactly what the
      industrial checkpoint lacks for most items.
    measured:
      lab_clip: media/LAB-PPE.mp4, 120 frames
      lab_at_conf_0.25: nothing detected at all, any class
      lab_at_conf_0.10: goggles 0.97/frame at median conf 0.14; no mask class
      lab_at_conf_0.05: goggles 1.77/frame median 0.11, no_goggles 0.78/frame
      control_clip: media/PPEVideo.mp4, 120 frames
      control_at_conf_0.25: no_glove 0.45/frame median 0.31; goggles 1 box
      control_at_conf_0.10: no_glove 2.08/frame median 0.17
    verdict: >-
      NOT a loading problem — the control proves the model runs and produces
      boxes on both clips. It is simply weak, and the published mAP50 of 0.278
      was honest. It never fires `mask` OR `no_mask` on either clip at ANY
      threshold down to 0.05, so the mask class is effectively dead. On
      construction footage full of hard hats it detects zero helmets.

      Not dangerous the way the industrial checkpoint is — it does not
      false-accuse, it is silent. But silence is worse than useless here:
      absence is evidence in R-11, so a zone requiring a mask would convict
      everyone on the detector's blindness. Everything it does emit sits far
      below our min_confidence of 0.40.

      Delete models/eval_keremberke_ppe_v8s.pt whenever you like; this record is
      the part worth keeping.

  medical_ppe:
    purpose: medical / laboratory PPE compliance (R-11, medical profile)
    file: models/ppe_yolo11s_best.pt
    sha256: 09e2804458c72d7e3ada7551a80f0bff547ef96998a739c59c4afdf3c31adcad
    bytes: 19187674
    source: >-
      FinBlade in-house. Trained 2026-09-14 in WSL at /home/usv/ppe
      (train.py, data/data.yaml), output runs/yolo11s_ppe/weights/best.pt;
      copied from C:\Users\ICSADMIN\ppe-dataset\model\ppe_yolo11s_best.pt.
      Training artifacts (results.csv, confusion_matrix.png, args.yaml) sit
      beside the original; not copied into the repo.
    framework: >-
      trained on ultralytics 8.4.152 / torch 2.11.0+cu128; LOADS AND RUNS on
      the pinned 8.3.40 (YOLO11 is a supported family there) — verified
      2026-09-15, tests/test_lab_ppe_model.py. Pin unchanged.
    base_model: yolo11s.pt (Ultralytics)
    training: 226 images / 267 boxes (16-36 per class), imgsz 640, 100 epochs
    classes_verified_from_weights:
      [Gloves, Goggles, Haircap, Labcoat, Mask,
       "No Gloves", "No Goggles", "No Haircap", "No Labcoat", "No Mask"]
    class_order_asserted: true       # ppe_client.PPE_CLASSES; a retrain that reorders is REFUSED
    consumed_classes: all ten        # -> surgical_gloves, goggles, surgical_cap, lab_coat, surgical_mask (+ no_ twins)
    published_metrics:
      valid: {images: 43, boxes: 42, mAP50: 0.360, mAP50_95: 0.210, precision: 0.73, recall: 0.32}
      test:  {images: 47, boxes: 57, mAP50: 0.217, mAP50_95: 0.103, precision: 0.20, recall: 0.34}
      per_class_test_mAP50: "0.04 (Gloves) .. 0.56 (No Labcoat)"
    status: evaluation
    production_validated: false
    site_validated: false
    license: >-
      Fine-tune of an Ultralytics AGPL-3.0 base — same commercial-licensing
      question as every other checkpoint here. Training images: origin and
      terms not recorded; establish before any deployment.
    license_verified: false
    measured_2026-09-15:
      own_test_split_47_images_cpu:
        seconds_per_image: 0.18
        boxes_at_0.25: {"No Labcoat": 13, Labcoat: 6, "No Mask": 4, Gloves: 3,
                        Goggles: 2, "No Gloves": 2, Haircap: 1, "No Haircap": 1}
        boxes_at_0.50: {"No Labcoat": 11, Labcoat: 2, "No Mask": 1, Goggles: 1}
        images_with_any_box: {at_0.25: 30, at_0.50: 15}
        note: >-
          At the user-visible 0.5 there is NO Gloves, Haircap or Mask positive
          across all 47 images — absence of a positive is this model's normal
          output, which is why medical_ppe.absence_weight defaults to 0.0.
      site_clip_media_LAB-PPE.mp4:
        clip: 1284x716 @ 24 fps, 241 frames, fisheye ceiling camera, 5 people
        person_height_px: {min: 28, median: 145, max: 337}
        full_frame_boxes: {at_0.05: 13, at_0.10: 5, at_0.25: 0, at_0.50: 0}
        person_crop_boxes_84_crops: {at_0.10: 50, at_0.25: 0, at_0.50: 0}
        verdict: >-
          SILENT ON THE SITE CAMERA. Nothing above 0.25 on full frames OR on
          padded person crops, so it is not a scale problem alone. The
          training frames are eye-level close-ups (people fill the 640px
          frame, white coats, production-line setting); the site camera is an
          overhead wide-angle with blue gowns at ~145px. A domain gap the
          retrain has to close with frames from the actual cameras. Evidence:
          evidence/lab_ppe/. See BLOCKERS.md B-9.
    notes: >-
      FIRST-PASS PLACEHOLDER. Wired so that a retrained checkpoint with the
      same class order drops in with no code change: medical_ppe.weights (or
      just overwrite the file). Everything user-visible sits behind
      conf 0.5, the grace/confirm/recover state machine, and explicit-negative-
      only evidence; every raw box >= 0.25 is journalled to
      evidence/ppe_raw/<camera>.jsonl for precision measurement.

  # --- SUPERSEDED CANDIDATE -------------------------------------------------
  # Was the `medical_ppe` slot until 2026-09-15; still selectable as
  # medical_ppe.checkpoint: mppe_yolo26s_v2, still unable to load on the pin.
  candidate_mppe_yolo26s_v2:
    purpose: medical PPE candidate (superseded by the in-house lab checkpoint)
    file: models/medical_ppe_yolo26s_v2.pt
    present: false                   # NOT IN models/ — nothing has been run
    sha256: null                     # generate locally once the file exists
    bytes: null
    source: stormbreaker20/yolo26s-mppe-detector-v2
    source_verified: 2026-09-14      # repo read; weights never downloaded
    download_date: null
    framework: "ultralytics >= 8.4.x REQUIRED — we are pinned at 8.3.40"
    base_model: yolo26s.pt (Ultralytics)
    training: 2931 images, 60 epochs, imgsz 512, batch 32
    published_metrics: null          # the model card publishes none at all
    classes_documented: [Person, Shoe_Covers, Surgical_Cap, Surgical_Gloves,
                         Surgical_Gown, Surgical_Mask, Surgical_Scrubs,
                         Face_Shield, Goggles, Coverall, No_Facial_Gear,
                         No_Medical_Attire, No_Surgical_Cap,
                         No_Surgical_Gloves]
    classes_verified_from_weights: false
    status: candidate                # superseded; never loaded
    production_validated: false
    site_validated: false
    license: "MIT is STATED by the repo — but see the note"
    license_verified: false
    blockers:
      - "Weights absent from models/."
      - >-
        ultralytics 8.3.40 has NO YOLO26 support (model families are
        3/5/6/8/9/10/11/rt-detr, zero source references to yolo26). YOLO26
        requires 8.4.x, and that pin change moves ByteTrack underneath the
        tracking layer.
    notes: >-
      LICENCE CONFLICT TO RESOLVE BEFORE ANY COMMERCIAL USE: the repository
      states MIT, but the stated base model is yolo26s.pt, which is Ultralytics
      AGPL-3.0. An AGPL derivative relabelled MIT is not something to rely on.
      Verify the repository, model and dataset terms independently.

      The class names above come from the MODEL CARD and use underscores, while
      the integration brief used spaces. The adapter matches on a case- and
      separator-folded key so either spelling resolves, but nothing is verified
      until the weights are read.

  appearance_attributes:
    purpose: >-
      zero-shot appearance tagging (clothing colour, headwear, mask, bag,
      outerwear) on per-track crops, for description search — finblade/attributes.py
    file: models/clip_vit_b32_laion2b.safetensors
    sha256: ac4f8c4b88af6d963118cbf40ad93176d092abbedfcb752601ae1866352656e6
    bytes: 605000000                 # approx; verify with `ls -l`
    source: huggingface.co/laion/CLIP-ViT-B-32-laion2B-s34B-b79K (open_clip_model.safetensors)
    architecture: open_clip ViT-B-32, LAION-2B s34B b79K
    loaded_by: services/inference/attr_client.py (open_clip_torch 3.3.0)
    format: safetensors             # chosen so it loads under torch's weights_only default;
                                    # the OpenAI-format checkpoint is a pickled TorchScript
                                    # archive that torch 2.11 refuses from a path
    status: evaluation
    production_validated: false
    site_validated: false
    license: "MIT (open_clip / LAION weights, as stated on the model card)"
    license_verified: false
    notes: >-
      General-purpose image-text model, NOT trained on CCTV crops. Tags are
      majority-voted over several crops and reported "unknown" below a
      confidence floor; every tag carries a crop for a human to confirm. The
      vocabulary is fixed (finblade/attributes.py) and refuses gender / age /
      ethnicity attribute names. Evaluate the "unknown" share per camera before
      trusting search results. DECISIONS.md D-41.
