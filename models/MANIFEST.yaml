# FinBlade CCTV — model manifest
#
# WHY THIS FILE EXISTS. Weights arrive from third parties, are gitignored, and
# are the one part of the system nobody can read. Without a manifest, "which
# checkpoint produced this evidence?" has no answer six months later, and
# "is this licence acceptable?" gets answered from memory.
#
# Hashes are generated LOCALLY from the files actually present:
#     sha256sum models/*.pt
# They are not copied from a model card — the point is to detect a file that
# is not what we think it is.
#
# LICENCE FIELDS ARE CLAIMS, NOT CLEARANCES. `license` records what the source
# states. `license_verified: false` means nobody has checked it against the
# actual repository, model and dataset terms, and it MUST stay false until
# someone has. Do not treat any of these as cleared for commercial deployment
# on the strength of this file.

models:

  person_detector:
    purpose: person detection (COCO class 0 only; the other 79 are discarded)
    file: models/yolo11s.pt
    sha256: 85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5
    bytes: 19313732
    source: Ultralytics YOLO11s (pretrained COCO)
    framework: ultralytics==8.3.40
    classes: 80 COCO classes
    consumed_classes: [person]
    status: evaluation
    production_validated: false
    site_validated: false
    license: AGPL-3.0 (Ultralytics)
    license_verified: false
    notes: >-
      Commercial deployment requires the approved Ultralytics commercial
      licensing arrangement. See DECISIONS.md D-31.

  tracker:
    purpose: per-camera track IDs
    file: null                       # built into ultralytics, not a weights file
    source: ByteTrack via ultralytics (tracker="bytetrack.yaml")
    framework: ultralytics==8.3.40
    status: evaluation
    notes: >-
      NOT A SEPARATE FILE, and the reason it is listed anyway: the tracker ships
      inside ultralytics, so any change to that pin changes track ID assignment
      — and track IDs key the ReID bindings, dwell, loitering and the PPE state
      machine. Upgrading ultralytics is a tracking change, not a detector change.

  reid:
    purpose: cross-camera appearance embeddings
    file: models/osnet_x0_25_msmt17.pt
    sha256: 6f57607fed9f502b9efed546108132ee715df5a5b6e6932c6269bacb47f59f99
    bytes: 3057863
    source: OSNet x0.25, MSMT17 weights, via boxmot
    framework: torch==2.11.0+cu128
    classes: null                    # an embedder, not a classifier
    status: evaluation
    production_validated: false
    site_validated: false
    license: "MSMT17 is RESEARCH USE ONLY — verify before any deployment"
    license_verified: false
    notes: >-
      Embeddings are held in RAM only and never reach disk, a log, the database
      or a response body. See CLAUDE.md and DECISIONS.md D-9 / D-30.

  hazard:
    purpose: fire and smoke detection (R-10)
    file: models/fire_smoke_yolov8n.pt
    sha256: b91633799ceb052c814b4f8b77a37efc9a40f002d528df97d74463585fa4f28f
    bytes: 6229802
    source: rabahdev/fire-smoke-yolov8n (D-Fire derived; D-Fire is CC0 1.0)
    framework: ultralytics==8.3.40
    classes: [smoke, fire]
    consumed_classes: [smoke, fire]
    status: evaluation
    production_validated: false
    site_validated: false
    license: AGPL-3.0 (based on Ultralytics YOLOv8)
    license_verified: false
    notes: >-
      Evaluation checkpoint, NOT a production-validated fire alarm. See
