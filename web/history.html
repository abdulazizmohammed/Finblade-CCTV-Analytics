<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinBlade — History & Logs</title>
<link rel="stylesheet" href="finblade-theme.css">
<style>
body{background:radial-gradient(1000px 500px at 80% -10%,var(--fb-teal-ghost),transparent 60%),var(--fb-void);min-height:100vh;}
.eyebrow{font-family:var(--fb-font-data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fb-text-faint);margin:0;}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--fb-surface);border-bottom:1px solid var(--fb-line);position:sticky;top:0;z-index:10;}
.brand-logo{height:28px;width:auto;display:block;filter:drop-shadow(0 0 8px var(--fb-teal-ghost));}
.tag{font-family:var(--fb-font-data);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fb-teal-bright);border:1px solid var(--fb-teal-dim);border-radius:2px;padding:2px 6px;}
.spacer{flex:1;}
.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 60px;}

.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:8px 0 18px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-family:var(--fb-font-data);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fb-text-muted);}
.field input,.field select{background:var(--fb-void);border:1px solid var(--fb-line);color:var(--fb-text);font-family:var(--fb-font-data);font-size:13px;padding:7px 9px;border-radius:var(--fb-r);}
.field input:focus,.field select:focus{outline:none;border-color:var(--fb-teal);box-shadow:0 0 0 3px var(--fb-teal-ghost);}
.seg{display:inline-flex;border:1px solid var(--fb-line-bright);border-radius:var(--fb-r);overflow:hidden;}
.seg button{background:transparent;border:0;color:var(--fb-text-muted);font-family:var(--fb-font-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;cursor:pointer;}
.seg button.on{background:var(--fb-teal);color:var(--fb-void);font-weight:600;}

.count{font-family:var(--fb-font-data);font-size:11px;color:var(--fb-text-muted);margin:0 0 8px;}
.tablewrap{overflow-x:auto;border:1px solid var(--fb-line);border-radius:var(--fb-r-lg);}
table{width:100%;border-collapse:collapse;min-width:720px;}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--fb-line);white-space:nowrap;}
th{font-family:var(--fb-font-data);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fb-text-faint);background:var(--fb-surface);position:sticky;top:0;}
td{font-size:12.5px;color:var(--fb-text);}
td.mono{font-family:var(--fb-font-data);font-variant-numeric:tabular-nums;color:var(--fb-text-muted);}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--fb-surface-2);}
.sev{font-family:var(--fb-font-data);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid currentColor;}
.sev.AMBER{color:var(--fb-warning);}
.sev.RED,.sev.CRITICAL{color:var(--fb-critical);}
.sev.INFO,.sev.NORMAL{color:var(--fb-ok);}
.rule{color:var(--fb-restricted);} /* restricted intrusion rows read magenta */
.thumb{color:var(--fb-teal);text-decoration:none;font-family:var(--fb-font-data);font-size:11px;}
.thumb:hover{text-decoration:underline;}
.empty{color:var(--fb-text-faint);font-family:var(--fb-font-data);font-size:12px;padding:22px;text-align:center;}

/* Person-track columns. The ref is INTERACTIVE (click to isolate that track),
   so teal is correct here as chrome — it says nothing about the track's state. */
.ref{color:var(--fb-teal);background:none;border:0;padding:0;cursor:pointer;
     font:inherit;font-family:var(--fb-font-data);font-variant-numeric:tabular-nums;}
.ref:hover{text-decoration:underline;}
.seq{color:var(--fb-text-faint);}
.path{font-family:var(--fb-font-data);color:var(--fb-text);}
.path .hop{color:var(--fb-text-faint);}      /* the arrows recede, the zones do not */
.path .now{color:var(--fb-text);font-weight:600;}
/* A track that only ever held one zone is the churn signature. Muted, NOT
   coloured: amber and red mean an operator must act, and a fragmented tracker
   is a data-quality observation, not a site condition. */
tr.single td,td.single{color:var(--fb-text-faint);}
.note{font-family:var(--fb-font-data);font-size:11px;color:var(--fb-text-faint);
      margin:0 0 8px;max-width:78ch;line-height:1.5;}

/* frame modal */
.modal{position:fixed;inset:0;background:rgba(4,10,14,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;}
.modal.on{display:flex;}
.modal .box{max-width:min(1000px,92vw);max-height:88vh;background:var(--fb-surface);border:1px solid var(--fb-line-bright);border-radius:var(--fb-r-lg);overflow:hidden;display:flex;flex-direction:column;}
.modal .box img{max-width:100%;max-height:74vh;object-fit:contain;background:var(--fb-void);}
.modal .cap{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-family:var(--fb-font-data);font-size:12px;color:var(--fb-text-muted);}
.modal .cap button{background:transparent;border:1px solid var(--fb-line-bright);color:var(--fb-text);font-family:var(--fb-font-data);font-size:11px;padding:5px 10px;border-radius:var(--fb-r);cursor:pointer;}
:focus-visible{outline:2px solid var(--fb-teal-bright);outline-offset:2px;}
</style>
</head>
<body>
  <div class="topbar">
    <img class="brand-logo" src="logo.svg" alt="FinBlade">
    <span class="tag">History &amp; Logs</span>
    <span class="spacer"></span>
    <a class="fb-btn" href="cameras.html">Cameras</a>
    <a class="fb-btn" href="/tools/zone-editor.html">Zones</a>
    <a class="fb-btn" href="report.html">Report</a>
    <a class="fb-btn fb-btn--primary" href="dashboard.html">← Live dashboard</a>
  </div>

  <div class="wrap">
    <div class="controls">
      <div class="seg" id="seg">
        <button data-mode="alerts" class="on">Alerts</button>
        <button data-mode="events">Movement</button>
      </div>
      <div class="field"><label for="from">From date</label><input type="date" id="from"></div>
      <div class="field"><label for="to">To date</label><input type="date" id="to"></div>
      <div class="field" id="typeField"><label for="type">Filter</label>
        <select id="type"><option value="">All</option></select></div>
      <div class="field"><label for="cam">Camera</label>
        <select id="cam"><option value="">All cameras</option></select></div>
      <div class="field"><label for="pref">Anon ref</label>
        <input type="text" id="pref" placeholder="pr_…" style="width:130px"></div>
      <div class="field"><label>&nbsp;</label><button class="fb-btn" id="refresh">Search</button></div>
    </div>

    <div id="flows"></div>
    <div id="tracks"></div>
    <p class="count" id="count">—</p>
    <div class="tablewrap"><table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </div>

  <div class="modal" id="modal">
    <div class="box">
      <img id="modalImg" alt="saved frame">
      <div class="cap"><span id="modalCap"></span>
        <button id="modalClose">Close (Esc)</button></div>
    </div>
  </div>

<script src="apikey.js"></script>
<script>
const API=location.origin;   // same origin as the page — see cameras.html
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;};
let mode='alerts';

const ALERT_TYPES=['R-01','R-02','R-03','R-05','R-06','R-07'];
const EVENT_TYPES=['ZONE_ENTRY','ZONE_EXIT','ZONE_TRANSITION','DENSITY_UPDATE',
  'CAPACITY_WARNING','RESTRICTED_ZONE_ENTRY','RESTRICTED_ZONE_EXIT',
  'LOITERING_START','LOITERING_END','CAMERA_ONLINE','CAMERA_OFFLINE','CAMERA_RECOVERED'];

function iso(ts){ // epoch seconds -> local YYYY-MM-DD HH:MM:SS
  const d=new Date(ts*1000);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function dayBounds(){
  const f=$('from').value, t=$('to').value;
  const from = f ? new Date(f+'T00:00:00').getTime()/1000 : 0;
  const to   = t ? new Date(t+'T23:59:59').getTime()/1000 : Date.now()/1000+86400;
  return {from,to};
}

function setMode(m){
  mode=m;
  for(const b of $('seg').children) b.classList.toggle('on', b.dataset.mode===m);
  // rebuild the type filter options
  const sel=$('type'); sel.innerHTML='<option value="">All</option>';
  (m==='alerts'?ALERT_TYPES:EVENT_TYPES).forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);});
  load();
}

async function loadCameras(){
  try{
    const {cameras}=await fetch(`${API}/api/v1/cameras`).then(r=>r.json());
    const sel=$('cam');
    cameras.forEach(c=>{const o=document.createElement('option');o.value=c.camera_id;o.textContent=c.camera_id;sel.appendChild(o);});
  }catch(e){}
}

async function load(){
  const {from,to}=dayBounds();
  const cam=$('cam').value, typ=$('type').value, pref=$('pref').value.trim();
  let rows;
  try{
    if(mode==='alerts'){
      $('flows').innerHTML=''; $('tracks').innerHTML='';
      const q=new URLSearchParams({from,to,limit:1000});
      if(cam)q.set('camera_id',cam); if(typ)q.set('rule_id',typ);
      rows=(await fetch(`${API}/api/v1/history/alerts?${q}`).then(r=>r.json())).alerts||[];
      renderAlerts(rows);
    }else{
      const q=new URLSearchParams({from,to,limit:1000});
      if(cam)q.set('camera_id',cam); if(typ)q.set('event_type',typ);
      if(pref)q.set('person_ref',pref);
      rows=(await fetch(`${API}/api/v1/history/events?${q}`).then(r=>r.json())).events||[];
      renderEvents(rows);
      loadFlows(cam);
    }
    $('count').textContent=`${rows.length} ${mode==='alerts'?'alerts':'events'} · ${$('from').value||'start'} → ${$('to').value||'now'}`;
  }catch(e){ $('count').textContent='offline — cannot reach the API at this origin'; }
}

async function loadFlows(cam){
  try{
    const q=new URLSearchParams({minutes:15});
    if(cam)q.set('camera_id',cam);
    const {flows}=await fetch(`${API}/api/v1/movement?${q}`).then(r=>r.json());
    if(!flows || !flows.length){ $('flows').innerHTML=''; return; }
    const rows=flows.map(f=>`<tr><td class="mono">${esc(f.zone_from)}</td>
      <td class="mono">→</td><td class="mono">${esc(f.zone_to)}</td>
      <td class="num">${f.count}</td></tr>`).join('');
    $('flows').innerHTML=`<p class="count">Zone → zone movement · last 15 min</p>
      <div class="tablewrap" style="margin-bottom:16px"><table>
      <thead><tr><th>From</th><th></th><th>To</th><th>Count</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }catch(e){ $('flows').innerHTML=''; }
}

function frameCell(fr){
  return fr ? `<a class="thumb" href="#" data-frame="${esc(fr)}">view frame ▸</a>` : '<span class="mono">—</span>';
}

// --- person tracks -------------------------------------------------------
// A person_ref is a salted hash of the ByteTrack id (finblade/identity.py), so
// it identifies a TRACK, not a person: it is scoped to one camera worker and
// one session. Grouping events by it therefore answers "did this id survive the
// walk between zones", which is exactly the question the tracker can fail at.
// It cannot answer "is this the same human as that one over there" — that needs
// the cross-camera global_ref, which is not written to events.

const SHORT=r=>String(r||'').slice(0,11);   // pr_ + 8 hex is plenty to eyeball
const DUR=s=>s<60?`${s.toFixed(1)}s`:`${Math.floor(s/60)}m ${Math.round(s%60)}s`;

// Zones this event touches, in travel order. A TRANSITION contributes BOTH ends
// so the origin is not lost when it is the first event in the window.
function zonesOf(e){
  const out=[];
  if(e.zone_from) out.push(e.zone_from);
  if(e.zone_to) out.push(e.zone_to);
  if(!e.zone_from && !e.zone_to && e.zone_id) out.push(e.zone_id);
  return out;
}

// Group the loaded events into one record per ref. Also stamps each event with
// its position in its own track (_seq of _of) so a row can say "3/7" — the
// cheapest way to see at a glance that a ref covers a real journey and not a
// single frame. Rows arrive ts DESC; tracks are built ascending.
function buildTracks(rows){
  const asc=rows.slice().sort((a,b)=>a.ts-b.ts);
  const byRef=new Map();
  for(const e of asc){
    const ref=e.person_ref;
    if(!ref) continue;                       // camera-level events have no ref
    let t=byRef.get(ref);
    if(!t){ t={ref,cameras:new Set(),first:e.ts,last:e.ts,n:0,path:[]}; byRef.set(ref,t); }
    if(e.camera_id) t.cameras.add(e.camera_id);
    t.last=e.ts; t.n+=1;
    e._seq=t.n; e._track=t;
    for(const z of zonesOf(e)){
      if(t.path[t.path.length-1]!==z) t.path.push(z);   // consecutive dedupe
    }
  }
  for(const t of byRef.values()){
    t.of=t.n; t.duration=t.last-t.first;
    t.zones=new Set(t.path).size;
  }
  return byRef;
}

function pathCell(path, here){
  if(!path.length) return '<span class="mono">—</span>';
  const parts=path.map(z=>
    `<span class="${z===here?'now':''}">${esc(z)}</span>`);
  return `<span class="path">${parts.join('<span class="hop"> → </span>')}</span>`;
}

function renderTracks(byRef){
  const box=$('tracks');
  const tracks=[...byRef.values()].sort((a,b)=>a.first-b.first);
  if(!tracks.length){ box.innerHTML=''; return; }

  // The churn figures. Median rather than mean: a handful of long-lived tracks
  // drags a mean upward and hides that most refs live for a moment.
  const durs=tracks.map(t=>t.duration).sort((a,b)=>a-b);
  const mid=durs.length%2 ? durs[(durs.length-1)/2]
                          : (durs[durs.length/2-1]+durs[durs.length/2])/2;
  const single=tracks.filter(t=>t.zones<=1).length;
  const pct=Math.round(single/tracks.length*100);

  const rows=tracks.map(t=>`
    <tr class="${t.zones<=1?'single':''}">
      <td class="mono"><button class="ref" data-ref="${esc(t.ref)}"
          title="${esc(t.ref)} — click to show only this track">${esc(SHORT(t.ref))}</button></td>
      <td class="mono">${esc([...t.cameras].join(', ')||'—')}</td>
      <td class="mono">${iso(t.first)}</td>
      <td class="mono">${DUR(t.duration)}</td>
      <td class="mono">${t.n}</td>
      <td class="mono">${t.zones}</td>
      <td>${pathCell(t.path)}</td>
    </tr>`).join('');

  const isolated=$('pref').value.trim();
  box.innerHTML=`<p class="count">Person tracks · ${tracks.length} refs ·
      median life ${DUR(mid)} · ${pct}% touched a single zone
      ${isolated?'· <button class="ref" id="clearRef">show all refs ✕</button>':''}</p>
    <p class="note">A ref is a hash of the tracker id, scoped to one camera and one
      session — so a ref ending and a new one starting does NOT mean a different
      person. Multi-zone paths are tracks that survived the walk; single-zone refs
      in bulk are the tracker fragmenting. Click a ref to isolate its events.</p>
    <div class="tablewrap" style="margin-bottom:16px"><table>
    <thead><tr><th>Ref</th><th>Camera</th><th>First seen</th><th>Life</th>
      <th>Events</th><th>Zones</th><th>Zone path</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  // Binding happens once, in renderEvents, after BOTH tables exist — wiring here
  // too would attach a second handler to every panel button and fire two queries
  // per click.
}

// Clicking a ref drops it into the existing Anon ref filter and re-queries, so
// the server does the narrowing (?person_ref=) rather than hiding rows locally
// — the 1000-row page limit would otherwise silently truncate a long track.
function wireRefs(){
  document.querySelectorAll('.ref[data-ref]').forEach(el=>{
    el.addEventListener('click', ev=>{
      ev.preventDefault(); ev.stopPropagation();   // do not open the frame modal
      $('pref').value=el.getAttribute('data-ref');
      load();
    });
  });
  const clear=$('clearRef');
  if(clear) clear.addEventListener('click', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    $('pref').value=''; load();
  });
}

function renderAlerts(rows){
  $('thead').innerHTML='<tr><th>Time</th><th>Rule</th><th>Severity</th><th>Zone</th><th>Camera</th><th>Message</th><th>Ack</th><th>Frame</th></tr>';
  if(!rows.length){ $('tbody').innerHTML='<tr><td colspan="8"><div class="empty">No alerts in range.</div></td></tr>'; return; }
  $('tbody').innerHTML=rows.map(a=>{
    const sev=String(a.severity||'INFO').toUpperCase();
    const isR06 = a.rule_id==='R-06';
    return `<tr class="${a.frame?'clickable':''}" ${a.frame?`data-frame="${esc(a.frame)}" data-cap="${esc(a.rule_id+' · '+iso(a.ts))}"`:''}>
      <td class="mono">${iso(a.ts)}</td>
      <td class="mono ${isR06?'rule':''}">${esc(a.rule_id)}</td>
      <td><span class="sev ${sev}">${esc(sev)}</span></td>
      <td class="mono">${esc(a.zone_id||'—')}</td>
      <td class="mono">${esc(a.camera_id||'—')}</td>
      <td>${esc(a.message)}</td>
      <td class="mono">${esc(a.acknowledged_by||'—')}</td>
      <td>${frameCell(a.frame)}</td></tr>`;
  }).join('');
  wireRows();
}

function renderEvents(rows){
  const byRef=buildTracks(rows);      // stamps _seq/_track on each row
  renderTracks(byRef);

  $('thead').innerHTML='<tr><th>Time</th><th>Type</th><th>Movement</th><th>Camera</th>'
    +'<th>Person</th><th>Track path</th><th>Frame</th></tr>';
  if(!rows.length){ $('tbody').innerHTML='<tr><td colspan="7"><div class="empty">No events in range.</div></td></tr>'; return; }
  $('tbody').innerHTML=rows.map(e=>{
    const move = e.zone_from||e.zone_to
      ? `${esc(e.zone_from||'·')} → ${esc(e.zone_to||e.zone_id||'·')}` : esc(e.zone_id||'—');
    const t=e._track;
    // Where this event sits in its own track, and the whole route that track
    // took. Reading down the column, a ref that keeps its id across zones shows
    // the same path repeating with the highlight advancing; a ref that dies at
    // the boundary shows a one-zone path and never appears again.
    const person = e.person_ref
      ? `<button class="ref" data-ref="${esc(e.person_ref)}"
           title="${esc(e.person_ref)} — click to show only this track">${esc(SHORT(e.person_ref))}</button>`
        + (t ? ` <span class="seq">${e._seq}/${t.of}</span>` : '')
      : '<span class="mono">—</span>';
    const here=zonesOf(e).slice(-1)[0];
    const pathTd = t ? pathCell(t.path, here) : '<span class="mono">—</span>';
    return `<tr class="${e.frame?'clickable':''}" ${e.frame?`data-frame="${esc(e.frame)}" data-cap="${esc(e.event_type+' · '+iso(e.ts))}"`:''}>
      <td class="mono">${iso(e.ts)}</td>
      <td class="mono">${esc(e.event_type)}</td>
      <td class="mono">${move}</td>
      <td class="mono">${esc(e.camera_id||'—')}</td>
      <td class="mono">${person}</td>
      <td class="${t&&t.zones<=1?'single':''}">${pathTd}</td>
      <td>${frameCell(e.frame)}</td></tr>`;
  }).join('');
  wireRows();
  wireRefs();
}

function wireRows(){
  document.querySelectorAll('[data-frame]').forEach(el=>{
    el.addEventListener('click', ev=>{
      ev.preventDefault();
      const fr=el.getAttribute('data-frame');
      const cap=(el.closest('tr')?.getAttribute('data-cap'))||fr;
      openFrame(fr, cap);
    });
  });
}
function openFrame(fr, cap){
  // Saved frames now require the key. An <img> cannot send a header, so it goes
  // in the query string — the same route the MJPEG feed already uses.
  $('modalImg').src=window.fbStreamUrl?window.fbStreamUrl(`${API}${fr}`):`${API}${fr}`;
  $('modalCap').textContent=cap;
  $('modal').classList.add('on');
}
function closeFrame(){ $('modal').classList.remove('on'); $('modalImg').src=''; }
$('modalClose').addEventListener('click', closeFrame);
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeFrame(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeFrame(); });

// init: default range = today
const today=new Date().toISOString().slice(0,10);
$('from').value=today; $('to').value=today;
for(const b of $('seg').children) b.addEventListener('click', ()=>setMode(b.dataset.mode));
$('refresh').addEventListener('click', load);
// Default the range to YESTERDAY rather than leaving it blank. Blank meant
// from=0 — every record since the system was installed — and the database grows
// by roughly 380 MB a day, so first load got slower every day it ran and would
// never get faster. Writing the date into the input rather than defaulting it
// silently also means the operator can SEE which range they are looking at, and
// widen it deliberately.
function defaultRange(){
  if($('from').value) return;
  const d=new Date(Date.now()-86400000);
  const p=n=>String(n).padStart(2,'0');
  $('from').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
defaultRange();
$('type').addEventListener('change', load);
$('cam').addEventListener('change', load);
$('pref').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });
loadCameras();
setMode('alerts');
</script>
